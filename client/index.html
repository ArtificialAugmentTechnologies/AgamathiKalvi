<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1222" />
    <title>Agamathikalvi — Tamil Nadu's No.1 Educational Helpline</title>
    <meta
      name="description"
      content="Career guidance and college admission counselling for Class 10, 11 and 12 students in Tamil Nadu."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      (function () {
        try {
          var t = localStorage.getItem('agamathi-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          var l = localStorage.getItem('agamathi-lang');
          if (l === 'ta') document.documentElement.lang = 'ta';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
